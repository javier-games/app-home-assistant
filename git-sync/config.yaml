name: Git Sync
version: "1.0.0"
slug: git_sync
description: >-
  Back up your Home Assistant configuration to a Git repository on every local
  change, and automatically pull remote updates on a schedule.
url: https://github.com/javier-games/app-home-assistant/tree/main/git-sync
codenotary: ""
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
boot: auto
startup: services
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch-sync
panel_title: Git Sync
hassio_api: true
homeassistant_api: false
map:
  - homeassistant_config:rw
  - share:rw
  - ssl:ro
options:
  repository_url: ""
  branch: main
  ssh_key: []
  ssh_key_path: ""
  ssh_key_type: ed25519
  ssh_key_comment: home-assistant-git-sync
  keep_remote_files:
    - README.md
    - LICENSE
    - LICENSE.md
    - .github
  backup_path: /homeassistant
  auto_pull: true
  pull_interval: 300
  auto_push: true
  push_debounce: 30
  commit_message: "Backup {timestamp}"
  commit_author_name: Home Assistant
  commit_author_email: home-assistant@local.lan
  include: []
  exclude:
    - secrets.yaml
    - "*.db"
    - "*.db-*"
    - "*.log"
    - "*.log.*"
    - .storage/
    - .cloud/
    - tts/
    - deps/
    - tmp/
    - backups/
    - "*.tar"
  log_level: info
schema:
  repository_url: str
  branch: str
  ssh_key:
    - str
  ssh_key_path: str?
  ssh_key_type: list(ed25519|rsa)
  ssh_key_comment: str
  keep_remote_files:
    - str?
  backup_path: str
  auto_pull: bool
  pull_interval: int(10,)
  auto_push: bool
  push_debounce: int(0,)
  commit_message: str
  commit_author_name: str
  commit_author_email: str
  include:
    - str?
  exclude:
    - str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
